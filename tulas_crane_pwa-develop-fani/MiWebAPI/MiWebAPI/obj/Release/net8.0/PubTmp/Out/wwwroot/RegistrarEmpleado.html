<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar empleado | Tula's Crane</title>

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos del administrador -->
    <link rel="stylesheet" href="css/DiseñoAdmin.css">
    <link rel="stylesheet" href="css/RegistrarEmpleado.css">

    <style>
        .alert-mensaje {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body class="registrar-empleado-page">

    <!-- HEADER ADMINISTRATIVO COMPARTIDO -->
    <div id="admin-header-placeholder"></div>

    <main class="registro-container">

        <header class="registro-titulo">
            <a href="Empleados.html" class="registro-regresar" aria-label="Regresar a empleados">
                <i class="bi bi-chevron-left"></i>
            </a>
            <h1>Registrar Empleado</h1>
        </header>

        <!-- CONTENEDOR DE RESPUESTAS / ERRORES -->
        <div id="mensajeRespuesta" class="alert-mensaje"></div>


        <form id="formRegistrarEmpleado" novalidate>

            <section class="registro-panel activo" aria-label="Datos personales">

                <div class="registro-campos">

                    <!-- NOMBRE(S) -->
                    <div class="campo campo-completo">
                        <label for="nombre">Nombre(s)</label>
                        <input type="text"
                               id="nombre"
                               name="nombre"
                               placeholder="Ej. Juan Carlos"
                               maxlength="100"
                               required>
                    </div>

                    <!-- APELLIDO PATERNO -->
                    <div class="campo">
                        <label for="apellidoPaterno">Apellido paterno</label>
                        <input type="text"
                               id="apellidoPaterno"
                               name="apellidoPaterno"
                               placeholder="Ej. Pérez"
                               maxlength="100"
                               required>
                    </div>

                    <!-- APELLIDO MATERNO -->
                    <div class="campo">
                        <label for="apellidoMaterno">Apellido materno</label>
                        <input type="text"
                               id="apellidoMaterno"
                               name="apellidoMaterno"
                               placeholder="Ej. Gómez"
                               maxlength="100">
                    </div>

                    <!-- PUESTO -->
                    <div class="campo campo-completo">
                        <label for="puesto">Puesto</label>
                        <select id="puesto" name="puesto" required>
                            <option value="" disabled selected>Selecciona el puesto</option>
                            <option value="Operador">Operador</option>
                            <option value="Maniobrista">Maniobrista</option>
                            <option value="Administración">Administración</option>
                        </select>
                    </div>

                    <!-- SALARIO -->
                    <div class="campo">
                        <label for="salario">Salario base</label>
                        <input type="number"
                               id="salario"
                               name="salario"
                               placeholder="Ej. 15000.00"
                               min="0.01"
                               step="0.01"
                               required>
                    </div>

                    <!-- RFC -->
                    <div class="campo">
                        <label for="rfc">RFC</label>
                        <input type="text"
                               id="rfc"
                               name="rfc"
                               placeholder="RFC del empleado"
                               maxlength="13"
                               style="text-transform: uppercase"
                               required>
                    </div>

                    <!-- DOMICILIO -->
                    <div class="campo campo-completo">
                        <label for="domicilio">Domicilio</label>
                        <input type="text"
                               id="domicilio"
                               name="domicilio"
                               placeholder="Domicilio completo"
                               maxlength="100"
                               required>
                    </div>

                </div>

                <div class="registro-botones">
                    <button type="submit" class="btn-registro" id="btnGuardar">
                        Guardar Empleado
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>

            </section>

        </form>

        <div class="registro-mascota registro-logo" aria-hidden="true">
            <img src="IMG/Copia%20de%20Tula's%20Crane%20Logo.png" alt="">
        </div>

    </main>

    <!-- HEADER COMPARTIDO -->
    <script src="js/Layout_Admin.js"></script>

    <!-- REGISTRO DE EMPLEADOS -->
    <script src="js/RegistrarEmpleado.js"></script>
</body>
</html>
