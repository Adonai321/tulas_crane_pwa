<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar maquinaria | Tula's Crane</title>

    <!-- Estilos del formulario -->
    <link rel="stylesheet" href="css/RegistrarMaquinaria.css">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- HEADER ADMINISTRATIVO COMPARTIDO -->
    <div id="admin-header-placeholder"></div>

    <main class="rm-container">

        <div class="rm-title-container">
            <a href="/Maquinaria.html"
               class="rm-back"
               aria-label="Regresar a maquinaria">
                <i class="bi bi-chevron-left"></i>
            </a>
            <h1>Registrar Maquinaria</h1>
        </div>

        <div class="rm-content">

            <!-- COLUMNA IZQUIERDA: FORMULARIO -->
            <section class="rm-form-section">

                <form id="registrarMaquinariaForm" novalidate>

                    <div class="rm-field">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" name="marca" placeholder="Ej. Grove, Terex, Manitowoc" maxlength="100" required>
                    </div>

                    <div class="rm-field">
                        <label for="modelo">Modelo</label>
                        <input type="text" id="modelo" name="modelo" placeholder="Ej. GMK 5250L, RT 880E, LTM 1100" maxlength="100" required>
                    </div>

                    <div class="rm-field-row">
                        <div class="rm-field">
                            <label for="capacidad">Capacidad</label>
                            <input type="text" id="capacidad" name="capacidad" placeholder="Ej. 30 toneladas" maxlength="50" required>
                        </div>

                        <div class="rm-field">
                            <label for="alcance">Alcance</label>
                            <input type="text" id="alcance" name="alcance" placeholder="Ej. 42 m" maxlength="50" required>
                        </div>
                    </div>

                    <div class="rm-field">
                        <label for="tipo">Tipo de maquinaria</label>
                        <select id="tipo" name="tipo" required>
                            <option value="" disabled selected>Selecciona el tipo</option>
                            <option value="Grúas">Grúas</option>
                            <option value="Plataformas">Plataformas</option>
                            <option value="Titán">Titán</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>

                    <div class="rm-field">
                        <label for="anio">Año</label>
                        <input type="number" id="anio" name="anio" placeholder="Ej. 2024" min="1950" max="2030" required>
                    </div>

                    <div class="rm-field">
                        <label for="placas">Placas</label>
                        <input type="text" id="placas" name="placas" placeholder="Número de placas" maxlength="50" required>
                    </div>

                    <div class="rm-actions" style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <a href="Maquinaria.html" class="rm-button" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #1e1e1e; color: #f8f8f8; border: 1px solid #444444;">
                            <i class="bi bi-grid"></i>
                            Ver maquinaria
                        </a>

                        <button type="submit" class="rm-button rm-button-primary" id="btnGuardar">
                            Guardar Maquinaria
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>

                </form>

            </section>

            <!-- COLUMNA DERECHA: LOGOTIPO -->
            <aside class="rm-image-section">
                <img src="IMG/Copia%20de%20Tula's%20Crane%20Logo.png" alt="Logotipo de Tula's Crane" class="rm-company-logo">
            </aside>

        </div>

    </main>

    <!-- LAYOUT ADMINISTRATIVO COMPARTIDO -->
    <script src="js/Layout_Admin.js"></script>

    <!-- TARJETA DE AVISO REUTILIZABLE -->
    <script src="js/AlertaPopup.js"></script>

    <!-- LÓGICA DE REGISTRO CON VALIDACIONES AMIGABLES -->
    <script>
        "use strict";

        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("registrarMaquinariaForm");
            const btnGuardar = document.getElementById("btnGuardar");

            // Función para validar cada campo y darle un mensaje claro al usuario
            function validarFormulario() {
                const marca = document.getElementById("marca");
                const modelo = document.getElementById("modelo");
                const capacidad = document.getElementById("capacidad");
                const alcance = document.getElementById("alcance");
                const tipo = document.getElementById("tipo");
                const anio = document.getElementById("anio");
                const placas = document.getElementById("placas");

                if (!marca.value.trim()) {
                    mostrarAviso({
                        tipo: "error",
                        titulo: "Falta la marca",
                        mensaje: "Por favor escribe la marca de la maquinaria (por ejemplo: Grove, Terex o Liebherr).",
                        alCerrar: () => marca.focus()
                    });
                    return false;
                }

                if (!modelo.value.trim()) {
                    mostrarAviso({
                        tipo: "error",
                        titulo: "Falta el modelo",
                        mensaje: "Por favor escribe el modelo exacto de la maquinaria (por ejemplo: LTM 1100 o RT 880E).",
                        alCerrar: () => modelo.focus()
                    });
                    return false;
                }

                if (!capacidad.value.trim()) {
                    mostrarAviso({
                        tipo: "error",
                        titulo: "Falta la capacidad",
                        mensaje: "Indica la capacidad de carga de la unidad (por ejemplo: 30 toneladas).",
                        alCerrar: () => capacidad.focus()
                    });
                    return false;
                }

                if (!alcance.value.trim()) {
                    mostrarAviso({
                        tipo: "error",
                        titulo: "Falta el alcance",
                        mensaje: "Indica el alcance máximo de la pluma o equipo (por ejemplo: 42 m).",
                        alCerrar: () => alcance.focus()
                    });
                    return false;
                }

                if (!tipo.value) {
                    mostrarAviso({
                        tipo: "error",
                        titulo: "Selecciona un tipo",
                        mensaje: "Elige una categoría en la lista desplegable de 'Tipo de maquinaria'.",
                        alCerrar: () => tipo.focus()
                    });
                    return false;
                }

                const anioNum = parseInt(anio.value, 10);
                const anioMaximo = new Date().getFullYear() + 1;
                if (!anio.value.trim() || isNaN(anioNum) || anioNum < 1950 || anioNum > anioMaximo) {
                    mostrarAviso({
                        tipo: "error",
                        titulo: "Año no válido",
                        mensaje: `Escribe un año de fabricación válido de 4 dígitos (entre 1950 y ${anioMaximo}).`,
                        alCerrar: () => anio.focus()
                    });
                    return false;
                }

                if (!placas.value.trim()) {
                    mostrarAviso({
                        tipo: "error",
                        titulo: "Faltan las placas",
                        mensaje: "Ingresa el número de placas o identificación vehicular de la unidad.",
                        alCerrar: () => placas.focus()
                    });
                    return false;
                }

                return true;
            }

            // Función para traducir errores técnicos a lenguaje humano
            function traducirErrorServidor(result, status) {
                const msgRaw = (result.message || result.mensaje || result.title || "").toLowerCase();

                if (msgRaw.includes("duplicate") || msgRaw.includes("unique") || result.numeroError === 2627 || result.numeroError === 2601) {
                    return "Ya existe una maquinaria registrada con esas mismas placas. Verifica el número de placa.";
                }

                if (msgRaw.includes("truncated") || result.numeroError === 8152 || result.numeroError === 2628) {
                    return "Uno de los textos que escribiste es demasiado largo. Intenta acortarlo un poco.";
                }

                if (msgRaw.includes("validation errors") || status === 400) {
                    // Si .NET envía detalles por campo, los extraemos
                    if (result.errors) {
                        const camposConError = Object.keys(result.errors).join(", ");
                        return `El servidor rechazó los siguientes datos: ${camposConError}. Revisa que estén escritos correctamente.`;
                    }
                    return "Algunos datos enviados no tienen el formato esperado por el sistema. Revisa los campos e inténtalo de nuevo.";
                }

                if (status === 404) {
                    return "No se encontró la ruta de registro en el servidor. Verifica que la API esté actualizada.";
                }

                // Si el backend ya envió un mensaje personalizado en español, lo mostramos directo
                if (result.message || result.mensaje) {
                    return result.message || result.mensaje;
                }

                return "Ocurrió un problema inesperado al guardar la maquinaria en la base de datos.";
            }

            form.addEventListener("submit", async function (evento) {
                evento.preventDefault();

                // 1. Validar antes de molestar al servidor
                if (!validarFormulario()) return;

                const maquinariaData = {
                    marca: document.getElementById("marca").value.trim(),
                    modelo: document.getElementById("modelo").value.trim(),
                    capacidad: document.getElementById("capacidad").value.trim(),
                    alcance: document.getElementById("alcance").value.trim(),
                    tipo: document.getElementById("tipo").value,
                    anio: parseInt(document.getElementById("anio").value, 10),
                    placas: document.getElementById("placas").value.trim().toUpperCase()
                };

                const textoOriginal = btnGuardar.innerHTML;
                btnGuardar.disabled = true;
                btnGuardar.innerHTML = 'Guardando...';

                try {
                    const response = await fetch('/api/Maquinaria/Registrar', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(maquinariaData)
                    });

                    const result = await response.json().catch(() => ({}));

                    if (response.ok && result.success) {
                        form.reset();

                        mostrarAviso({
                            tipo: "exito",
                            titulo: "¡Maquinaria registrada!",
                            mensaje: `La unidad ${maquinariaData.marca} ${maquinariaData.modelo} se guardó correctamente en el inventario.`
                        });
                    } else {
                        const mensajeAmigable = traducirErrorServidor(result, response.status);
                        mostrarAviso({
                            tipo: "error",
                            titulo: "No se pudo registrar la maquinaria",
                            mensaje: mensajeAmigable
                        });
                    }

                } catch (error) {
                    console.error("Error de conexión:", error);
                    mostrarAviso({
                        tipo: "error",
                        titulo: "Sin conexión con el servidor",
                        mensaje: "No se pudo establecer comunicación con el sistema. Verifica tu conexión o que el servidor esté encendido."
                    });
                } finally {
                    btnGuardar.disabled = false;
                    btnGuardar.innerHTML = textoOriginal;
                }
            });
        });
    </script>

</body>
</html>
