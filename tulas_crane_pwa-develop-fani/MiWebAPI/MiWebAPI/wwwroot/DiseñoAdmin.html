<!-- HEADER ADMINISTRATIVO DE TULA'S CRANE -->

<header class="admin-header" id="adminHeader">

    <!-- LOGOTIPO Y NOMBRE -->

    <div class="admin-brand" aria-label="Tula's Crane">

        <img class="admin-brand-logo"
             src="IMG/Copia%20de%20Tula's%20Crane%20Logo.png"
             alt="Logotipo de Tula's Crane">

        <span class="admin-brand-copy">
            <span class="admin-brand-name">TULA'S CRANE</span>
            <span class="admin-brand-slogan">
                Pasión en cada proyecto
            </span>
        </span>

    </div>

    <!-- NAVEGACIÓN PRINCIPAL -->

    <nav class="admin-nav"
         id="adminNav"
         aria-label="Navegación administrativa">

        <!-- INICIO -->

        <a class="admin-nav-link"
           href="Dashboard.html"
           data-page="dashboard">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 10 9-7 9 7" />
                <path d="M5 9v12h5v-7h4v7h5V9" />
            </svg>

            <span>Inicio</span>
        </a>

        <!-- MAQUINARIA -->

        <a class="admin-nav-link"
           href="Maquinaria.html"
           data-page="maquinaria">

            <svg viewBox="0 0 32 24" aria-hidden="true">
                <path d="M2 15h4l2-5h8l3 5h5V5h4l3 6v4h-3" />
                <path d="M2 15v3h3m5 0h11m5 0h4v-3" />
                <circle cx="7" cy="18" r="3" />
                <circle cx="23" cy="18" r="3" />
                <path d="M16 10h5m-5 0V6h5" />
            </svg>

            <span>Maquinaria</span>
        </a>

        <!-- EMPLEADOS -->

        <a class="admin-nav-link"
           href="Empleados.html"
           data-page="empleados">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 8a5 5 0 0 1 10 0v2H7z" />
                <path d="M4 21v-4a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v4" />
                <path d="M9 12v3m6-3v3M9 4V2h6v2M5 7H3m18 0h-2" />
            </svg>

            <span>Empleados</span>
        </a>

        <!-- CALENDARIO -->

        <a class="admin-nav-link"
           href="Calendario.html"
           data-page="calendario">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M7 3v4m10-4v4M3 10h18" />
                <path d="M7 14h2m3 0h2m3 0h1M7 17h2m3 0h2" />
            </svg>

            <span>Calendario</span>
        </a>

        <!-- FINANZAS -->

    </nav>

    <!-- ACCIONES: TEMA Y CERRAR SESIÓN -->

    <div class="admin-actions-wrap">

        <!-- CAMBIAR TEMA -->

        <button type="button"
                id="adminThemeToggle"
                class="admin-theme-btn"
                aria-label="Cambiar tema">

            <svg class="icon-sun"
                 viewBox="0 0 24 24"
                 aria-hidden="true">

                <circle cx="12" cy="12" r="4"></circle>

                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>

            </svg>

            <svg class="icon-moon"
                 viewBox="0 0 24 24"
                 style="display:none;"
                 aria-hidden="true">

                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

            </svg>

            <span class="theme-label">Claro</span>

        </button>

        <!-- CERRAR SESIÓN -->

        <button type="button"
                class="admin-logout-btn"
                id="adminLogoutButton"
                aria-label="Cerrar sesión">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>

            <span>Salir</span>

        </button>

    </div>

</header>
