
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Tula's Crane</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/DiseñoAdmin.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Header compartido -->
    <div id="admin-header-placeholder"></div>

    <main class="login-page">

        <!-- Panel izquierdo: identidad de la empresa -->
        <section class="login-brand">
            <img src="IMG/Copia%20de%20Tula%27s%20Crane%20Logo.png"
                 alt="Logo de Tula's Crane"
                 class="brand-logo">

            <h1>TULA'S CRANE</h1>
            <p>Soluciones que mueven grandes proyectos.</p>
        </section>

        <!-- Panel derecho: formulario -->
        <section class="login-form-section">

            <div class="login-panel">

                <h2>Bienvenido</h2>
                <p class="login-description">
                    Accede al panel administrativo
                </p>

                <form id="formLogin">

                    <div class="login-input">
                        <i class="bi bi-person"></i>

                        <input type="email"
                               id="correo"
                               name="correo"
                               placeholder="Usuario"
                               aria-label="Correo electrónico"
                               autocomplete="username"
                               required>
                    </div>

                    <div class="login-input">
                        <i class="bi bi-lock"></i>

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Contraseña"
                               aria-label="Contraseña"
                               autocomplete="current-password"
                               required>

                        <button type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <label class="remember-option">
                        <input type="checkbox" id="recordarme">
                        <span>Recordarme</span>
                    </label>

                    <div id="mensajeLogin"
                         class="login-message d-none"
                         role="alert"></div>

                    <button type="submit"
                            id="btnLogin"
                            class="login-button">
                        <span>Iniciar sesión</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>

                </form>

                <a href="/index.html" class="back-public">
                    <i class="bi bi-arrow-left"></i>
                    Volver al sitio público
                </a>

            </div>
        </section>

    </main>

    <!-- Footer compartido -->
    <div id="admin-footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/Layout_Admin.js"></script>
    <script src="js/login.js"></script>

    <!-- Mostrar u ocultar contraseña -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const boton = document.getElementById("togglePassword");
            const campo = document.getElementById("password");

            if (!boton || !campo) return;

            boton.addEventListener("click", function () {
                const mostrar = campo.type === "password";

                campo.type = mostrar ? "text" : "password";

                boton.innerHTML = mostrar
                    ? '<i class="bi bi-eye-slash"></i>'
                    : '<i class="bi bi-eye"></i>';

                boton.setAttribute(
                    "aria-label",
                    mostrar ? "Ocultar contraseña" : "Mostrar contraseña"
                );

                boton.setAttribute("aria-pressed", String(mostrar));
            });
        });
    </script>

</body>
</html>
